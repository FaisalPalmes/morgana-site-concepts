<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sovereign photo picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--wine:#3a0e17;--ivory:#f6f1e7;--gold:#c8a870;--ink:#1d1a17;--mute:#7d7268;--line:rgba(58,14,23,.14)}
*{box-sizing:border-box;margin:0}
body{background:var(--ivory);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif;padding:0 16px 120px}
header{position:sticky;top:0;z-index:5;background:var(--ivory);padding:18px 0 14px;border-bottom:1px solid var(--line);margin:0 -16px 8px;padding-left:16px;padding-right:16px}
h1{font:500 26px/1.1 'Cormorant Garamond',serif;letter-spacing:.02em}
.hint{color:var(--mute);font-size:13px;margin-top:6px}
.sum{font-size:13px;margin-top:6px}
.sum b{font-weight:500}
section{padding:26px 0 8px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
h2{font:500 21px/1.2 'Cormorant Garamond',serif}
.n{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.n.ok{color:#2f6b3a}.n.over{color:#a3332d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{position:relative;padding:0;border:0;background:#e9e1d3;aspect-ratio:2/3;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.ph .k{position:absolute;left:6px;bottom:5px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.ph .o{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 13px/1 Jost,sans-serif;background:rgba(255,255,255,.75);color:transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ph.on{box-shadow:0 0 0 3px var(--wine)}
.ph.on .o{background:var(--wine);color:var(--ivory)}
.grid.some .ph:not(.on) img{opacity:.55}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--wine);color:var(--ivory);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:6}
.bar span{font-size:13px}
.bar button{font:500 12px/1 Jost,sans-serif;letter-spacing:.16em;text-transform:uppercase;border:0;padding:13px 16px;background:var(--ivory);color:var(--wine);cursor:pointer}
.bar button.g{background:transparent;color:var(--ivory);box-shadow:inset 0 0 0 1px rgba(246,241,231,.4)}
textarea{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <h1>Sovereign photo picks</h1>
  <p class="hint">Tap photos in the order you want them shown (first = the shop card). Aim for 2–4 per piece. Then tap Copy and paste it to Claude.</p>
  <p class="sum" id="sum"></p>
</header>
<main id="list"></main>
<div class="bar"><span id="tot"></span><span><button type="button" class="g" id="clr">Clear</button> <button type="button" id="cp">Copy picks</button></span></div>
<textarea id="ta" aria-hidden="true"></textarea>
<script src="assets/products.js"></script>
<script>
(function(){
  var M=window.MORGANA, all=Array.isArray(M)?M:(M.products||M.all);
  var items=all.filter(function(p){return p.collection==='sovereign'&&!p.hidden});
  var KEY='mor-picks-v1', picks={};
  try{picks=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){picks={}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(picks))}catch(e){}}
  function tag(src){return src.split('/').pop().replace('.jpg','')}
  var list=document.getElementById('list');
  list.innerHTML=items.map(function(p){
    return '<section data-id="'+p.id+'"><div class="top"><h2>'+p.name+'</h2><span class="n"></span></div><div class="grid">'+
      p.images.map(function(s){return '<button type="button" class="ph" data-t="'+tag(s)+'" aria-pressed="false" aria-label="'+p.name+', photo '+tag(s)+'"><img src="'+s+'" alt="" loading="lazy"><span class="k">'+tag(s)+'</span><span class="o"></span></button>'}).join('')+
      '</div></section>'}).join('');
  function paint(){
    var done=0,total=0;
    document.querySelectorAll('section').forEach(function(sec){
      var id=sec.dataset.id, sel=picks[id]||[], n=sec.querySelector('.n'), g=sec.querySelector('.grid');
      sec.querySelectorAll('.ph').forEach(function(b){var i=sel.indexOf(b.dataset.t);b.classList.toggle('on',i>-1);b.setAttribute('aria-pressed',i>-1);b.querySelector('.o').textContent=i>-1?i+1:''});
      g.classList.toggle('some',sel.length>0);
      n.textContent=sel.length?sel.length+' picked':'not picked';
      n.className='n'+(sel.length>=2&&sel.length<=4?' ok':sel.length>4?' over':'');
      if(sel.length>=2&&sel.length<=4)done++; total+=sel.length;
    });
    document.getElementById('sum').innerHTML='<b>'+done+' of '+items.length+'</b> pieces have 2–4 photos';
    document.getElementById('tot').textContent=total+' photos picked';
  }
  list.addEventListener('click',function(e){
    var b=e.target.closest('.ph'); if(!b)return;
    var id=b.closest('section').dataset.id, sel=picks[id]=picks[id]||[], i=sel.indexOf(b.dataset.t);
    if(i>-1)sel.splice(i,1); else sel.push(b.dataset.t);
    if(!sel.length)delete picks[id];
    save(); paint();
  });
  document.getElementById('clr').onclick=function(){if(confirm('Clear all picks?')){picks={};save();paint()}};
  document.getElementById('cp').onclick=function(){
    var txt='Sovereign photo picks\n'+items.filter(function(p){return picks[p.id]}).map(function(p){return p.id+' '+p.name+': '+picks[p.id].join(', ')}).join('\n');
    var btn=this;
    function ok(){btn.textContent='Copied';setTimeout(function(){btn.textContent='Copy picks'},1600)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fb); else fb();
    function fb(){var t=document.getElementById('ta');t.value=txt;t.select();try{document.execCommand('copy');ok()}catch(e){prompt('Copy this:',txt)}}
  };
  paint();
})();
</script>
</body>
</html>
